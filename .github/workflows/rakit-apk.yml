name: Rakit & Rilis APK

# Proyek build berdiri sendiri (bukan fork): kode + workflow + keystore tetap.
# Rilis selalu ke tag TETAP `apk-terbaru`, jadi URL unduhan tidak berubah tiap build.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      jenis:
        description: "release (bertanda tangan) atau debug"
        type: choice
        options: [release, debug]
        default: release
      rilis:
        description: "Terbitkan juga ke GitHub Release (tag apk-terbaru)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  rakit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Cek Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMGR="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          [ -n "$SDKMGR" ] || SDKMGR="$(command -v sdkmanager)"
          "$SDKMGR" --list_installed 2>/dev/null | sed -n '1,20p' || true
          for p in "platform-tools" "platforms;android-37" "build-tools;37.0.0"; do
            if "$SDKMGR" --install "$p" > /dev/null 2>&1; then echo "terpasang: $p"; else echo "dilewati: $p"; fi
          done
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true

      - name: Siapkan keystore tetap
        if: ${{ (github.event.inputs.jenis || 'release') == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret keystore belum dipasang."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ALIAS="${KEY_ALIAS:-fuwanime}"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$ALIAS" >/dev/null 2>&1; then
            ALIAS=$(keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
              | awk -F, '/PrivateKeyEntry/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1; exit }')
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Tentukan versi dari tag
        run: |
          # Hanya tag semver (v2.6.0), BUKAN tag rilis `apk-terbaru` yang juga menempel di commit.
          TAG=$(git tag --merged HEAD --sort=-v:refname 2>/dev/null | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          [ -n "$TAG" ] || TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
          V="${TAG#v}"
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          echo "versi: $V (code $CODE) dari tag $TAG"
          {
            echo "VERSION_NAME=$V"
            echo "VERSION_CODE=$CODE"
            echo "UPDATE_REPO=HiuraKiyowoo/fuwastream-build"
          } >> "$GITHUB_ENV"

      - name: Rakit APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          echo "VERSION_NAME=$VERSION_NAME VERSION_CODE=$VERSION_CODE UPDATE_REPO=$UPDATE_REPO"
          if [ "${{ github.event.inputs.jenis || 'release' }}" = "debug" ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          fi

      - name: Kumpulkan APK + cetak sidik jari
        run: |
          mkdir -p keluaran
          find app/build/outputs/apk -name "*.apk" -exec cp {} keluaran/ \;
          ls -l keluaran/
          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          for f in keluaran/*.apk; do
            echo "== $f"; "$BT/apksigner" verify --print-certs "$f" | sed -n '1,4p'
          done
          # Bukti identitas: applicationId + label yang benar-benar tertanam di APK
          A="${BT}aapt"
          for f in keluaran/*.apk; do
            "$A" dump badging "$f" 2>/dev/null | grep -E "^package:|application-label:" | head -2
          done

      - name: Unggah artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuwastream-apk
          path: keluaran/*.apk
          if-no-files-found: error

      - name: Terbitkan ke tag tetap (apk-terbaru)
        if: ${{ (github.event.inputs.rilis == null || github.event.inputs.rilis == 'true') && (github.event.inputs.jenis || 'release') == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${VERSION_NAME:-unknown}"
          {
            echo "**Versi:** \`$VER\` · commit \`${GITHUB_SHA:0:7}\` · $(date -u '+%d %b %Y %H:%M UTC')"
            echo
            echo "**APK di aset ini (bertanda tangan keystore tetap):**"
            for f in keluaran/*.apk; do echo "- \`$(basename "$f")\` — $(du -h "$f" | cut -f1)"; done
            echo
            echo "**Perubahan terakhir:**"
            git log -n 10 --pretty=format:"- %s"
          } > catatan-rilis.md
          gh release edit apk-terbaru --title "Kahoon $VER" --notes-file catatan-rilis.md \
            || gh release create apk-terbaru --title "Kahoon $VER" --notes-file catatan-rilis.md --target main
          gh release upload apk-terbaru keluaran/*.apk --clobber
